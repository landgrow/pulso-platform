<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSO — Plano de Ação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F6F3;
      --surface: #FFFFFF;
      --surface-hover: #F0EFEC;
      --primary: #1B4332;
      --accent: #74C69D;
      --accent-dim: #D8F3DC;
      --text: #1C1917;
      --text-muted: #78716C;
      --text-faint: #A8A29E;
      --border: #E7E5E4;
      --border-strong: #C8C5C0;
      --danger: #DC2626;
      --warning: #D97706;
      --success: #16A34A;
      --col-a-fazer: #94A3B8;
      --col-andamento: #3B82F6;
      --col-revisao: #EAB308;
      --col-revisao-cliente: #8B5CF6;
      --col-concluido: #22C55E;
      --col-cancelado: #EF4444;
      --font: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-heading: 'DM Sans', system-ui, sans-serif;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
      --radius: 10px;
      --radius-sm: 6px;
    }

    [data-theme="dark"] {
      --bg: #111110;
      --surface: #1C1C1A;
      --surface-hover: #242422;
      --text: #F5F5F4;
      --text-muted: #A8A29E;
      --text-faint: #78716C;
      --border: #2E2E2C;
      --border-strong: #444440;
      --accent-dim: #1B4332;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.4);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    /* Header */
    .header {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-logo {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
    }

    .view-tabs {
      display: flex;
      gap: 4px;
      background: var(--surface-hover);
      padding: 4px;
      border-radius: 8px;
    }

    .view-tab {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.15s;
    }

    .view-tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    .view-tab:hover:not(.active) {
      color: var(--text);
    }

    .search-box {
      flex: 1;
      max-width: 320px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-hover);
      color: var(--text);
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.15s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      background: var(--surface);
    }

    .search-box svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      width: 16px;
      height: 16px;
    }

    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      padding: 2px;
      display: none;
    }

    .search-box.has-value .search-clear {
      display: block;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .btn-icon:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border-strong);
    }

    /* Toolbar */
    .toolbar {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .group-chips {
      display: flex;
      gap: 6px;
    }

    .chip {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    .chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .divider {
      width: 1px;
      height: 24px;
      background: var(--border);
    }

    .filter-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }

    .filter-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px 4px 10px;
      border-radius: 16px;
      font-size: 12px;
      background: var(--accent-dim);
      color: var(--primary);
    }

    .filter-chip button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--primary);
      padding: 2px;
      display: flex;
      opacity: 0.7;
    }

    .filter-chip button:hover {
      opacity: 1;
    }

    .btn-add-filter {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      border: 1px dashed var(--border-strong);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-add-filter:hover {
      border-color: var(--accent);
      color: var(--primary);
    }

    /* Board */
    .board-container {
      height: calc(100vh - 110px);
      overflow-x: auto;
      overflow-y: hidden;
      padding: 20px;
    }

    .board {
      display: flex;
      gap: 16px;
      height: 100%;
      min-width: max-content;
    }

    .column {
      width: 300px;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .column-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .column-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .column-title {
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 600;
      flex: 1;
    }

    .column-count {
      font-size: 12px;
      color: var(--text-faint);
      background: var(--surface-hover);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .column-body {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .column-body.drag-over {
      background: var(--accent-dim);
      border: 2px dashed var(--accent);
      border-radius: 0 0 8px 8px;
    }

    .column.drag-over {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      cursor: grab;
      transition: all 0.15s;
      user-select: none;
    }

    .card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
    }

    .card.dragging {
      opacity: 0.4;
      transform: rotate(2deg);
      box-shadow: var(--shadow-lg);
    }

    .card-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 10px;
      color: var(--text);
    }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-priority-alta { background: #FEE2E2; color: #991B1B; }
    .badge-priority-media { background: #FEF3C7; color: #92400E; }
    .badge-priority-baixa { background: #DCFCE7; color: #166534; }
    .badge-tag { background: var(--surface-hover); color: var(--text-muted); }
    .badge-client { background: var(--accent-dim); color: var(--primary); }
    .badge-dependency { background: #FEF3C7; color: #92400E; font-size: 10px; }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .card-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-date.overdue { color: var(--danger); }
    .card-date.done { color: var(--success); }

    .card-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--primary);
      font-size: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .card-comments, .card-subtasks {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-faint);
    }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      transition: all 0.2s;
      z-index: 50;
    }

    .fab:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-lg);
    }

    /* Theme Toggle */
    .theme-toggle {
      position: fixed;
      bottom: 24px;
      left: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      z-index: 50;
      transition: all 0.15s;
    }

    .theme-toggle:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.95);
      transition: transform 0.2s;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 600;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .modal-body {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-hover);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--accent);
      background: var(--surface);
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-title-input {
      font-size: 18px;
      font-weight: 600;
      font-family: var(--font-heading);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
      font-family: var(--font);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--surface);
      border-color: var(--border-strong);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    .btn-icon-text {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-footer-left {
      flex: 1;
      display: flex;
      gap: 8px;
    }

    /* Config Panel */
    .config-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 380px;
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 150;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .config-panel.active {
      transform: translateX(0);
    }

    .config-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 140;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .config-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .config-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .config-title {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 600;
    }

    .config-tabs {
      display: flex;
      gap: 4px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .config-tab {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .config-tab.active {
      background: var(--primary);
      color: white;
    }

    .config-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .config-section {
      margin-bottom: 20px;
    }

    .config-section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .config-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .config-option {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      background: var(--surface);
      color: var(--text);
      transition: all 0.15s;
    }

    .config-option:hover {
      border-color: var(--border-strong);
    }

    .config-option.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--primary);
    }

    .config-visibility-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .config-visibility-item:last-child {
      border-bottom: none;
    }

    .config-visibility-label {
      flex: 1;
      font-size: 13px;
    }

    .config-visibility-toggle {
      width: 36px;
      height: 20px;
      border-radius: 10px;
      background: var(--border);
      border: none;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }

    .config-visibility-toggle::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      top: 2px;
      left: 2px;
      transition: transform 0.2s;
    }

    .config-visibility-toggle.active {
      background: var(--accent);
    }

    .config-visibility-toggle.active::after {
      transform: translateX(16px);
    }

    .config-filter-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .config-filter-row select, .config-filter-row input {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-hover);
      color: var(--text);
      font-size: 13px;
    }

    .config-filter-row button {
      padding: 8px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-add-filter-row {
      width: 100%;
      padding: 10px;
      border: 1px dashed var(--border-strong);
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
    }

    .btn-add-filter-row:hover {
      border-color: var(--accent);
      color: var(--primary);
    }

    .color-dots {
      display: flex;
      gap: 8px;
    }

    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
    }

    .color-dot:hover {
      transform: scale(1.15);
    }

    .color-dot.active {
      border-color: var(--text);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--bg);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 300;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Comment Section */
    .comments-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .comment {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--primary);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .comment-body {
      flex: 1;
    }

    .comment-author {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .comment-text {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .comment-input-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .comment-input-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-hover);
      color: var(--text);
      font-size: 13px;
    }

    .comment-input-row button {
      padding: 10px 16px;
      background: var(--primary);

        state.cards = [...DEFAULT_CARDS];
      }

      // Apply theme
      if (state.theme === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
      }
    }

    function saveState() {
      const toSave = {
        cards: state.cards,
        activeFilters: state.activeFilters,
        groupBy: state.groupBy,
        sortBy: state.sortBy,
        sortDir: state.sortDir,
        visibleProps: state.visibleProps,
        columnColors: state.columnColors,
        theme: state.theme
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    }

    // =========================================
    // RENDERING
    // =========================================
    function renderBoard() {
      const board = document.getElementById('board');
      const columns = COLUMNS[state.groupBy] || COLUMNS['status'];

      board.innerHTML = columns.map(col => {
        const cards = getCardsForColumn(col.id);
        return `
          <div class="column" data-column="${col.id}">
            <div class="column-header">
              <div class="column-dot" style="background: ${col.color}"></div>
              <span class="column-title">${col.title}</span>
              <span class="column-count">${cards.length}</span>
            </div>
            <div class="column-body" data-column="${col.id}">
              ${cards.length === 0 ? `
                <div class="empty-column">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M9 12h6M12 9v6"/>
                  </svg>
                  <p>Sem tarefas</p>
                </div>
              ` : cards.map(card => renderCard(card)).join('')}
            </div>
          </div>
        `;
      }).join('');

      // Setup drag events
      setupDragEvents();
    }

    function getCardsForColumn(columnId) {
      let cards = state.cards.filter(card => {
        if (state.groupBy === 'status') return card.status === columnId;
        if (state.groupBy === 'prioridade') return card.prioridade === columnId;
        if (state.groupBy === 'responsavel') return card.responsavel === columnId;
        if (state.groupBy === 'setor') return card.setor === columnId;
        return false;
      });

      // Apply search filter
      if (state.searchQuery) {
        const query = state.searchQuery.toLowerCase();
        cards = cards.map(card => {
          const match = card.title.toLowerCase().includes(query) ||
                        card.desc?.toLowerCase().includes(query) ||
                        card.cliente?.toLowerCase().includes(query);
          const el = document.querySelector(`[data-card="${card.id}"]`);
          if (el) {
            if (match) {
              el.classList.remove('hidden');
            } else {
              el.classList.add('hidden');
            }
          }
          return { ...card, _hidden: !match };
        }).filter(c => !c._hidden);
      } else {
        // Remove all hidden classes
        document.querySelectorAll('.card.hidden').forEach(el => el.classList.remove('hidden'));
      }

      // Apply active filters
      cards = cards.filter(card => {
        return state.activeFilters.every(filter => {
          const cardVal = card[filter.prop];
          if (filter.op === 'equals') return cardVal === filter.val;
          if (filter.op === 'not_equals') return cardVal !== filter.val;
          return true;
        });
      });

      // Sort
      cards.sort((a, b) => {
        let valA = a[state.sortBy];
        let valB = b[state.sortBy];

        if (state.sortBy === 'prazo') {
          valA = valA ? new Date(valA) : new Date('9999-12-31');
          valB = valB ? new Date(valB) : new Date('9999-12-31');
          return state.sortDir === 'asc' ? valA - valB : valB - valA;
        }

        if (typeof valA === 'string') {
          valA = valA.toLowerCase();
          valB = valB.toLowerCase();
        }

        if (valA < valB) return state.sortDir === 'asc' ? -1 : 1;
        if (valA > valB) return state.sortDir === 'asc' ? 1 : -1;
        return 0;
      });

      return cards;
    }

    function renderCard(card) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const prazoDate = card.prazo ? new Date(card.prazo) : null;
      const isOverdue = prazoDate && prazoDate < today && card.status !== 'concluido' && card.status !== 'cancelado';
      const isDone = card.status === 'concluido' || card.doneDate;

      const priorityClass = `badge-priority-${card.prioridade}`;
      const priorityLabel = { alta: 'Alta', media: 'Média', baixa: 'Baixa' }[card.prioridade];

      const initials = getInitials(card.responsavel);

      let dateClass = '';
      if (isDone) dateClass = 'done';
      else if (isOverdue) dateClass = 'overdue';

      const formattedDate = card.prazo ? formatDate(card.prazo) : '';

      return `
        <div class="card" data-card="${card.id}" draggable="true">
          <div class="card-title">${card.title}</div>
          <div class="card-badges">
            ${state.visibleProps.priority ? `<span class="badge ${priorityClass}">${priorityLabel}</span>` : ''}
            ${state.visibleProps.setor && card.setor ? `<span class="badge badge-tag">${card.setor}</span>` : ''}
            ${state.visibleProps.cliente && card.cliente ? `<span class="badge badge-client">${card.cliente}</span>` : ''}
            ${state.visibleProps.dependency && card.dependency ? `<span class="badge badge-dependency">Depende de: ${card.dependency}</span>` : ''}
          </div>
          ${(card.subtasks || card.comments?.length) ? `
            <div class="card-footer">
              ${state.visibleProps.subtasks && card.subtasks ? `
                <div class="card-subtasks">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                  </svg>
                  ${card.subtasks}
                </div>
              ` : ''}
              ${state.visibleProps.comments && card.comments?.length ? `
                <div class="card-comments">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                  </svg>
                  ${card.comments.length}
                </div>
              ` : ''}
            </div>
          ` : ''}
          <div class="card-meta">
            ${state.visibleProps.prazo && formattedDate ? `<span class="card-date ${dateClass}">${formattedDate}</span>` : '<span></span>'}
            ${state.visibleProps.responsavel && initials ? `<div class="card-avatar">${initials}</div>` : ''}
          </div>
        </div>
      `;
    }

    function getInitials(name) {
      if (!name) return '';
      return name.split(' ').map(n => n[0]).join('').substring(0, 2);
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
    }

    // =========================================
    // DRAG AND DROP
    // =========================================
    function setupDragEvents() {
      const cards = document.querySelectorAll('.card');
      const columns = document.querySelectorAll('.column-body');

      cards.forEach(card => {
        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragend', handleDragEnd);
        card.addEventListener('click', handleCardClick);
      });

      columns.forEach(col => {
        col.addEventListener('dragover', handleDragOver);
        col.addEventListener('dragleave', handleDragLeave);
        col.addEventListener('drop', handleDrop);
      });
    }

    function handleDragStart(e) {
      draggedCard = e.target;
      draggedCard.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', e.target.dataset.card);
    }

    function handleDragEnd(e) {
      if (draggedCard) {
        draggedCard.classList.remove('dragging');
      }
      document.querySelectorAll('.column-body').forEach(col => col.classList.remove('drag-over'));
      document.querySelectorAll('.column').forEach(col => col.classList.remove('drag-over'));
      draggedCard = null;
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const columnBody = e.currentTarget;
      columnBody.classList.add('drag-over');
      columnBody.closest('.column').classList.add('drag-over');
    }

    function handleDragLeave(e) {
      const columnBody = e.currentTarget;
      if (!columnBody.contains(e.relatedTarget)) {
        columnBody.classList.remove('drag-over');
        columnBody.closest('.column').classList.remove('drag-over');
      }
    }

    function handleDrop(e) {
      e.preventDefault();
      const columnBody = e.currentTarget;
      columnBody.classList.remove('drag-over');
      columnBody.closest('.column').classList.remove('drag-over');

      const cardId = e.dataTransfer.getData('text/plain');
      const newColumnId = columnBody.dataset.column;

      const card = state.cards.find(c => c.id === cardId);
      if (!card) return;

      // Update card based on groupBy
      if (state.groupBy === 'status') {
        card.status = newColumnId;
      } else if (state.groupBy === 'prioridade') {
        card.prioridade = newColumnId;
      } else if (state.groupBy === 'responsavel') {
        card.responsavel = newColumnId;
      } else if (state.groupBy === 'setor') {
        card.setor = newColumnId;
      }

      saveState();
      renderBoard();
      showToast('Tarefa movida');
    }

    // =========================================
    // CARD EDITOR
    // =========================================
    function handleCardClick(e) {
      if (e.target.closest('.card').classList.contains('dragging')) return;
      const cardId = e.currentTarget.dataset.card;
      openCardEditor(cardId);
    }

    function openCardEditor(cardId) {
      editingCardId = cardId;
      const card = state.cards.find(c => c.id === cardId);
      if (!card) return;

      document.getElementById('cardTitle').value = card.title;
      document.getElementById('cardDesc').value = card.desc || '';
      document.getElementById('cardStatus').value = card.status;
      document.getElementById('cardPriority').value = card.prioridade;
      document.getElementById('cardResponsavel').value = card.responsavel;
      document.getElementById('cardSetor').value = card.setor || '';
      document.getElementById('cardPrazo').value = card.prazo || '';
      document.getElementById('cardCliente').value = card.cliente || '';

      // Render comments
      const commentsList = document.getElementById('commentsList');
      commentsList.innerHTML = card.comments?.map(c => `
        <div class="comment">
          <div class="comment-avatar">${getInitials(c.author)}</div>
          <div class="comment-body">
            <div class="comment-author">${c.author}</div>
            <div class="comment-text">${c.text}</div>
          </div>
        </div>
      `).join('') || '';

      document.getElementById('cardModal').classList.add('active');
    }

    function closeCardEditor() {
      editingCardId = null;
      document.getElementById('cardModal').classList.remove('active');
    }

    function saveCard() {
      const card = state.cards.find(c => c.id === editingCardId);
      if (!card) return;

      card.title = document.getElementById('cardTitle').value;
      card.desc = document.getElementById('cardDesc').value;
      card.status = document.getElementById('cardStatus').value;
      card.prioridade = document.getElementById('cardPriority').value;
      card.responsavel = document.getElementById('cardResponsavel').value;
      card.setor = document.getElementById('cardSetor').value;
      card.prazo = document.getElementById('cardPrazo').value;
      card.cliente = document.getElementById('cardCliente').value;

      saveState();
      renderBoard();
      closeCardEditor();
      showToast('Tarefa salva');
    }

    function deleteCard() {
      if (!confirm('Excluir esta tarefa?')) return;
      state.cards = state.cards.filter(c => c.id !== editingCardId);
      saveState();
      renderBoard();
      closeCardEditor();
      showToast('Tarefa excluída');
    }

    function duplicateCard() {
      const card = state.cards.find(c => c.id === editingCardId);
      if (!card) return;

      const newCard = {
        ...card,
        id: 'card-' + Date.now(),
        title: card.title + ' (cópia)'
      };
      state.cards.push(newCard);
      saveState();
      renderBoard();
      closeCardEditor();
      showToast('Tarefa duplicada');
    }

    function archiveCard() {
      state.cards = state.cards.filter(c => c.id !== editingCardId);
      saveState();
      renderBoard();
      closeCardEditor();
      showToast('Tarefa arquivada');
    }

    function addComment() {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text) return;

      const card = state.cards.find(c => c.id === editingCardId);
      if (!card) return;

      if (!card.comments) card.comments = [];
      card.comments.push({ author: 'Nayara', text });

      saveState();
      input.value = '';
      openCardEditor(editingCardId);
      showToast('Comentário adicionado');
    }

    // NEW ITEM

    function openNewItemModal() {
      document.getElementById('newTitle').value = '';
      document.getElementById('newStatus').value = 'a-fazer';
      document.getElementById('newPriority').value = 'media';

      document.getElementById('newSetor').value = '';

      document.getElementById('newItemModal').classList.remove('active');
    }

    function createNewItem() {
      const title = document.getElementById('newTitle').value.trim();
      if (!title) {
        showToast('Digite um título');
        return;
      }

      const newCard = {
        id: 'card-' + Date.now(),
        title,
        status: document.getElementById('newStatus').value,
        prioridade: document.getElementById('newPriority').value,
        responsavel: document.getElementById('newResponsavel').value,
        setor: document.getElementById('newSetor').value,
        prazo: document.getElementById('newPrazo').value,
        cliente: document.getElementById('newCliente').value,
        desc: document.getElementById('newDesc').value,
        comments: [],
        dependency: null,
        subtasks: null,
        doneDate: null
      };

      state.cards.push(newCard);
      saveState();
      renderBoard();
      closeNewItemModal();
      showToast('Tarefa criada');
    }

    // =========================================
    // FILTERS
    // =========================================
    function updateFilterChips() {
      const container = document.getElementById('filterChips');
      container.innerHTML = state.activeFilters.map((f, i) => `
        <div class="filter-chip">
          <span>${f.prop} ${f.op === 'equals' ? 'é' : 'não é'} ${f.val}</span>
          <button onclick="removeFilter(${i})">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
          </button>

    function removeFilter(index) {
      state.activeFilters.splice(index, 1);
      saveState();
      updateFilterChips();
      renderBoard();
      renderConfigContent('filtros');

    function openFilterModal() {
      updateFilterValueOptions();
      document.getElementById('filterModal').classList.add('active');

    function closeFilterModal() {
      document.getElementById('filterModal').classList.remove('active');
    }

    function updateFilterValueOptions() {
      const field = document.getElementById('filterField').value;
      const select = document.getElementById('filterValue');
      let options = [];

      if (field === 'status') {
        options = ['a-fazer', 'em-andamento', 'revisao', 'revisao-cliente', 'concluido', 'cancelado'];
      } else if (field === 'prioridade') {
        options = ['alta', 'media', 'baixa'];
      } else if (field === 'responsavel') {
        options = ['NAYARA', 'CLIENTE', 'CANDIDO'];
      } else if (field === 'setor') {
        options = ['Operacional', 'RH', 'Financeiro', 'Marketing', 'Administrativo', 'Estratégico', 'Vendas', 'Inovação', 'Jurídico', 'Liderança'];
      } else if (field === 'cliente') {
        options = ['JS Construtora', 'RS Company', 'Ontech TI'];
      }

      select.innerHTML = options.map(o => `<option value="${o}">${o}</option>`).join('');
    }

    function applyFilter() {
      const field = document.getElementById('filterField').value;
      const op = document.getElementById('filterOperator').value;
      const val = document.getElementById('filterValue').value;

      state.activeFilters.push({ prop: field, op, val });
      saveState();
      updateFilterChips();
      renderBoard();
      closeFilterModal();
      renderConfigContent('filtros');
    }

    // =========================================
    // THEME
    // =========================================
    function toggleTheme() {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', state.theme);
      saveState();
    }

    // =========================================
    // SEARCH
    // =========================================
    function handleSearch(e) {
      state.searchQuery = e.target.value;
      const searchBox = document.getElementById('searchBox');
      searchBox.classList.toggle('has-value', !!state.searchQuery);
      renderBoard();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      state.searchQuery = '';
      document.getElementById('searchBox').classList.remove('has-value');
      renderBoard();
    }

    // =========================================
    // TOAST
    // =========================================
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // =========================================
    // EVENT LISTENERS
    // =========================================
    function setupEventListeners() {
      // Config panel
      document.getElementById('btnConfig').addEventListener('click', openConfigPanel);
      document.getElementById('configClose').addEventListener('click', closeConfigPanel);
      document.getElementById('configOverlay').addEventListener('click', closeConfigPanel);
      document.querySelectorAll('.config-tab').forEach(tab => {
        tab.addEventListener('click', () => renderConfigContent(tab.dataset.tab));
      });

      // New item
      document.getElementById('btnNewItem').addEventListener('click', openNewItemModal);
      document.getElementById('newItemModalClose').addEventListener('click', closeNewItemModal);
      document.getElementById('btnCancelNewItem').addEventListener('click', closeNewItemModal);
      document.getElementById('btnCreateItem').addEventListener('click', createNewItem);

      // Card editor
      document.getElementById('cardModalClose').addEventListener('click', closeCardEditor);
      document.getElementById('btnSaveCard').addEventListener('click', saveCard);
      document.getElementById('btnDeleteCard').addEventListener('click', deleteCard);
      document.getElementById('btnDuplicateCard').addEventListener('click', duplicateCard);
      document.getElementById('btnArchiveCard').addEventListener('click', archiveCard);
      document.getElementById('btnAddComment').addEventListener('click', addComment);

      // Modal overlays
      document.getElementById('cardModal').addEventListener('click', e => {
        if (e.target.classList.contains('modal-overlay')) closeCardEditor();
      });
      document.getElementById('newItemModal').addEventListener('click', e => {
        if (e.target.classList.contains('modal-overlay')) closeNewItemModal();
      });

      // Filter
      document.getElementById('btnAddFilter').addEventListener('click', openFilterModal);
      document.getElementById('filterModalClose').addEventListener('click', closeFilterModal);
      document.getElementById('btnCancelFilter').addEventListener('click', closeFilterModal);
      document.getElementById('btnApplyFilter').addEventListener('click', applyFilter);
      document.getElementById('filterField').addEventListener('change', updateFilterValueOptions);
      document.getElementById('filterModal').addEventListener('click', e => {
        if (e.target.classList.contains('modal-overlay')) closeFilterModal();
      });

      // Theme
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);

      // Search
      document.getElementById('searchInput').addEventListener('input', handleSearch);
      document.getElementById('searchClear').addEventListener('click', clearSearch);

      // Group chips
      document.querySelectorAll('.chip[data-group]').forEach(chip => {
        chip.addEventListener('click', () => {
          state.groupBy = chip.dataset.group;
          saveState();
          updateGroupChips();
          renderBoard();
        });
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          closeCardEditor();
          closeNewItemModal();
          closeFilterModal();
          closeConfigPanel();
        }
      });
    }

    // Initialize
    init();
  </script>
</body>
</html>
